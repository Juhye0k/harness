[project]
name = "shortform-harness"
version = "0.1.0"
description = "Development foundation for a short-form video service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery[redis]>=5.5,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
docs = ["resvg-py>=0.2,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL, Redis and a Celery worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
