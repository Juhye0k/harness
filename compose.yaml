name: shortform-harness

x-app: &app
  build: .
  image: shortform-harness:local
  environment: &app-environment
    DATABASE_URL: postgresql+psycopg://shortform:local-dev-only@postgres:5432/shortform
    REDIS_URL: redis://redis:6379/0
    APP_ENV: development
    ENABLE_AUTH: ${ENABLE_AUTH:-false}
    AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:8000}
    VIDEO_DATA_DIR: /data/jobs
    ENABLE_PAID_AI: ${ENABLE_PAID_AI:-false}
    ENABLE_FREE_AI: ${ENABLE_FREE_AI:-false}
    GROQ_FREE_TIER_CONFIRMED: ${GROQ_FREE_TIER_CONFIRMED:-false}
    TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-groq}
    RECOMMENDATION_PROVIDER: ${RECOMMENDATION_PROVIDER:-none}
    RECOMMENDATION_MODEL: ${RECOMMENDATION_MODEL:-gpt-5.6-terra}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *app
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]

  api:
    <<: *app
    environment:
      <<: *app-environment
      GOOGLE_LOGIN_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID:-}
      GOOGLE_LOGIN_CLIENT_SECRET: ${GOOGLE_LOGIN_CLIENT_SECRET:-}
      ENABLE_SNS_UPLOAD: ${ENABLE_SNS_UPLOAD:-false}
      SNS_ORIGIN: ${SNS_ORIGIN:-http://localhost:8000}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      SNS_TOKEN_KEY: ${SNS_TOKEN_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes: ["video_data:/data:ro"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 5
    mem_limit: 512m

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes: ["video_data:/data"]
    command: ["/app/.venv/bin/celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "shortform,video"]
    mem_limit: 1g

  analysis-worker:
    <<: *app
    environment:
      <<: *app-environment
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes: ["video_data:/data"]
    command: ["/app/.venv/bin/celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "analysis"]
    mem_limit: 1g

  sns-worker:
    <<: *app
    profiles: ["sns"]
    environment:
      <<: *app-environment
      ENABLE_SNS_UPLOAD: ${ENABLE_SNS_UPLOAD:-false}
      SNS_ORIGIN: ${SNS_ORIGIN:-http://localhost:8000}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      SNS_TOKEN_KEY: ${SNS_TOKEN_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes: ["video_data:/data:ro"]
    command: ["/app/.venv/bin/celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "sns"]
    mem_limit: 512m

  cleanup:
    <<: *app
    profiles: ["auth"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes: ["video_data:/data"]
    command: ["/app/.venv/bin/python", "-m", "app.cli.cleanup_data", "--loop"]
    mem_limit: 256m

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: shortform
      POSTGRES_USER: shortform
      POSTGRES_PASSWORD: local-dev-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortform -d shortform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  video_data:
