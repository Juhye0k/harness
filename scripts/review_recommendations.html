<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>추천 수작업 평가</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#17243b;font:16px/1.6 system-ui}main{max-width:1100px;margin:32px auto;padding:20px}h1{margin:0}p{color:#52627a}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel,article{background:white;padding:24px;border-radius:16px;margin:16px 0;border:1px solid #dde3ec}video{width:100%;max-height:400px;background:#111;border-radius:12px}.player{position:sticky;top:15px;align-self:start}label{display:block;margin:12px 0}select,input,textarea,button{font:inherit;padding:10px;border:1px solid #b8c3d3;border-radius:8px;max-width:100%}textarea{width:100%;min-height:90px}input[type=number]{width:130px}button{cursor:pointer;background:#eef2f9}button.primary{background:#2455d6;color:white;border-color:#2455d6}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap}.message{white-space:pre-wrap}#message{padding:12px;background:#eaf0ff}details{margin-top:12px}.actions{position:sticky;bottom:0;padding:16px;background:#fff;border-top:1px solid #ddd}a{color:#2455d6}@media(max-width:760px){.layout{display:block}.player{position:static}main{margin:0;padding:12px}}
</style>
<main><h1>추천 수작업 평가</h1><p>후보 영상을 보고 선택 여부와 수정 이유를 남겨 주세요. 미선택은 오답을 뜻하지 않습니다.</p>
<div id="message" role="status">평가를 불러오는 중…</div>
<div class="layout"><section class="player panel"><video id="video" controls preload="metadata" src="/media"></video><p id="playing">후보의 ‘구간 재생’을 누르세요.</p><label>평가자 <input id="reviewer" placeholder="이름 또는 별칭"></label><p>점수 기준: 0 이해·사용 불가 → 2 수정 필요 → 4 그대로 사용 가능</p><p id="progress"></p></section><section id="candidates"></section></div>
<section class="panel"><h2>사람이 고른 기준 구간</h2><p>추천을 보기 전에 골라 둔 구간은 비교 기준으로 사용할 수 있습니다. AI 추천 결과와 구분해 저장합니다.</p><div class="row"><label>기준 시작(초) <input id="reference-start" type="number" min="0" step="0.01" value="0"></label><label>기준 종료(초) <input id="reference-end" type="number" min="0" step="0.01" value="30"></label><button id="add-reference">기준 구간 추가</button></div><div id="references"></div><details><summary>시간별 전사 확인</summary><div id="transcript-segments"></div></details><label>전사에서 발견한 문제 <textarea id="transcription"></textarea></label><label>후보 다양성·전체 의견 <textarea id="diversity"></textarea></label></section>
<div class="actions"><button id="save" class="primary">평가 저장</button> <button id="reload">저장본 다시 불러오기</button><span id="downloads" hidden> · <a href="/api/download/review">평가 JSON</a> · <a href="/api/download/report">보고서</a> · <a href="/api/download/handoff">자동화 인계</a></span></div>
</main><script>
let state,dirty=false,stop=null;const el=id=>document.getElementById(id),video=el('video');
const node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
video.addEventListener('timeupdate',()=>{if(stop!==null&&video.currentTime>=stop){video.pause();stop=null}});
video.addEventListener('error',()=>{el('message').textContent='영상을 재생하지 못했습니다. 평가를 확정하지 말고 재생 문제를 알려 주세요.'});
function select(label,values,value,onchange){const l=node('label',label+' '),s=document.createElement('select');s.setAttribute('aria-label',label);for(const [v,t] of values){const o=node('option',t);o.value=v;s.append(o)}s.value=value;s.onchange=()=>{onchange(s.value);dirty=true};l.append(s);return l}
function show(){el('candidates').replaceChildren();for(const c of state.snapshot.candidates){const r=state.review.ratings.find(x=>x.candidate_id===c.id),card=node('article','');card.append(node('h2',c.title||'추천 후보'),node('p',`${(c.start_ms/1000).toFixed(2)}~${(c.end_ms/1000).toFixed(2)}초`));
 const row=node('div','');row.className='row';for(const [label,padding] of [['구간 재생',0],['앞뒤 2초 확인',2]]){const b=node('button',label);b.onclick=()=>{video.currentTime=Math.max(0,c.start_ms/1000-padding);stop=Math.min(state.snapshot.evaluation_input.duration_ms/1000,c.end_ms/1000+padding);video.play().catch(()=>{el('message').textContent='영상 재생 버튼을 눌러 주세요.'});el('playing').textContent=c.title||'후보 재생 중'};row.append(b)}card.append(row);
 card.append(select('선택 여부',[['','미판정'],['yes','선택'],['no','미선택']],r.selected===null?'':r.selected?'yes':'no',v=>r.selected=v===''?null:v==='yes'));
 card.append(select('사용 가능 판정',[['','미평가'],['yes','사용 가능'],['no','사용 불가'],['uncertain','판단 보류']],r.uncertain?'uncertain':r.usable===null?'':r.usable?'yes':'no',v=>{r.uncertain=v==='uncertain';r.usable=['yes','no'].includes(v)?v==='yes':null}));
 for(const [key,label] of [['boundaries','시작·끝의 자연스러움'],['independence','원본 없이 이해 가능']])card.append(select(label,[['','미평가'],...Array.from({length:5},(_,i)=>[String(i),String(i)])],r[key]===null?'':String(r[key]),v=>r[key]=v===''?null:Number(v)));
 const edit=node('div','');edit.className='row';const inputs=[];for(const [key,label,value] of [['start_ms','수정 시작(초)',c.start_ms],['end_ms','수정 종료(초)',c.end_ms]]){const l=node('label',label+' '),i=document.createElement('input');i.type='number';i.step='0.01';i.min='0';i.max=state.snapshot.evaluation_input.duration_ms/1000;i.value=(r.edited_range?.[key]??value)/1000;i.setAttribute('aria-label',label);inputs.push(i);l.append(i);edit.append(l)}for(const i of inputs)i.oninput=()=>{r.edited_range={start_ms:Math.round(Number(inputs[0].value)*1000),end_ms:Math.round(Number(inputs[1].value)*1000)};dirty=true};card.append(edit);
 const reasons=node('div','수정·사용 불가 이유 (복수 선택)');for(const [value,label] of [['preference','개인 선호'],['context','문맥 누락'],['boundary','시작·끝 잘림'],['transcription','전사 오류'],['duplicate','중복'],['title','제목 불일치'],['other','기타']]){const l=node('label',label+' '),i=document.createElement('input');i.type='checkbox';i.checked=r.reasons.includes(value);i.onchange=()=>{r.reasons=i.checked?[...new Set([...r.reasons,value])]:r.reasons.filter(x=>x!==value);dirty=true};l.prepend(i);reasons.append(l)}card.append(reasons);
 const l=node('label','구체적인 이유·제안 '),notes=document.createElement('textarea');notes.value=r.notes;notes.oninput=()=>{r.notes=notes.value;dirty=true};l.append(notes);card.append(l);
 const d=node('details','');d.append(node('summary','AI 점수·이유 보기'),node('p',`점수 ${c.score??'없음'} · ${c.reason??''}`));card.append(d);el('candidates').append(card)}
 el('reviewer').value=state.review.reviewer;el('transcription').value=state.review.transcription_notes;el('diversity').value=state.review.diversity_notes;el('downloads').hidden=!state.revision;el('progress').textContent=`추천 후보 ${state.snapshot.candidates.length}개 · 저장 상태: ${state.report.evaluation_status==='complete'?'사람 평가 입력 완료':'평가 진행 중'}`;if(!state.snapshot.candidates.length)el('candidates').append(node('p','추천 후보가 없습니다. 후보 없음은 품질 합격이 아닙니다.'));
}
function references(){el('references').replaceChildren();state.review.references.forEach((r,index)=>{const row=node('p',`${r.start_ms/1000}~${r.end_ms/1000}초 `),play=node('button','기준 구간 재생'),remove=node('button','이 구간 기록 취소');play.onclick=()=>{video.currentTime=r.start_ms/1000;stop=r.end_ms/1000;video.play()};remove.onclick=()=>{state.review.references.splice(index,1);dirty=true;references()};row.append(play,remove);el('references').append(row)})}
el('add-reference').onclick=()=>{const start=Math.round(Number(el('reference-start').value)*1000),end=Math.round(Number(el('reference-end').value)*1000);if(start<0||end<=start||end>state.snapshot.evaluation_input.duration_ms){el('message').textContent='원본 안에서 시작보다 뒤에 있는 종료 시각을 입력하세요.';return}state.review.references.push({start_ms:start,end_ms:end});dirty=true;references()};
async function load(){const response=await fetch('/api/review');if(!response.ok)throw Error('평가를 불러오지 못했습니다.');state=await response.json();show();references();el('transcript-segments').replaceChildren();for(const s of state.transcript){const p=node('p',`${(s.start_ms/1000).toFixed(2)}초 · ${s.text}`),b=node('button','이 대사 듣기');b.onclick=()=>{video.currentTime=s.start_ms/1000;stop=s.end_ms/1000;video.play()};p.prepend(b);el('transcript-segments').append(p)}dirty=false;el('message').textContent=state.snapshot.recommendation_attempt?'Groq 인증 오류로 실제 AI 추천 후보가 없습니다. 원본·전사를 보며 기준 구간과 의견을 먼저 저장할 수 있습니다. AI 추천 품질 평가는 아직 완료할 수 없습니다.':'영상 확인 후 평가를 저장하세요. 저장된 평가는 다음 개선 회차에 재사용됩니다.'}
for(const id of ['reviewer','transcription','diversity'])el(id).oninput=()=>{dirty=true};
el('reload').onclick=()=>{if(!dirty||confirm('저장하지 않은 변경을 버리고 저장본을 불러올까요?'))load().catch(e=>el('message').textContent=e.message)};
el('save').onclick=async()=>{el('save').disabled=true;try{state.review.reviewer=el('reviewer').value;state.review.transcription_notes=el('transcription').value;state.review.diversity_notes=el('diversity').value;const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:state.revision,review:state.review})});const result=await response.json();if(!response.ok)throw Error(typeof result.detail==='string'?result.detail:'입력값을 확인해 주세요.');state.revision=result.revision;state.report=result.report;dirty=false;el('downloads').hidden=false;el('message').textContent=result.handoff.status==='ready_for_analysis'?'저장했습니다. 사람 평가 입력이 완료되어 개선 분석에 사용할 수 있습니다. 자동 외부 호출은 실행하지 않습니다.':'저장했습니다. 미평가·보류 항목이 남아 있어 사람 평가를 기다립니다.';el('progress').textContent=`사용 가능 ${result.report.usable_count}개 · 미평가 ${result.report.unreviewed_count}개 · 보류 ${result.report.uncertain_count}개`}catch(e){el('message').textContent=e.message}finally{el('save').disabled=false}};
load().catch(e=>el('message').textContent=e.message);
</script></html>
