name: Isolated failure drills
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: failure-drills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker-termination:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.3"
      - run: uv sync --locked
      - run: docker compose -f compose.integration.yaml build runner
      - name: Exercise worker and API termination in a generated project
        run: uv run python scripts/run_failure_drills.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-failure-drills
          path: .artifacts/failure-drills/*/result.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
