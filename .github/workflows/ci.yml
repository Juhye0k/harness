name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked
      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: uv run python scripts/verify.py

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker build --target production -t shortform-harness:ci .
      - run: docker compose -f compose.integration.yaml build runner
      - run: docker compose -f compose.integration.yaml up --no-build -d api worker analysis-worker sns-worker
      - name: Run integration and end-to-end flow
        id: integration-tests
        run: docker compose -f compose.integration.yaml run --rm runner
      - name: Collect synthetic end-to-end evidence
        if: always() && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'failure')
        run: |
          mkdir -p .artifacts/e2e
          if ! docker compose -f compose.integration.yaml run --rm --no-deps -T --entrypoint /bin/tar runner --exclude='*.mp4' -C /data -cf - e2e > .artifacts/e2e/evidence.tar; then
            echo "No complete end-to-end evidence was available; inspect the test failure above."
          fi
      - uses: actions/upload-artifact@v7
        if: always() && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'failure')
        with:
          name: synthetic-e2e-evidence
          path: .artifacts/e2e/evidence.tar
          include-hidden-files: true # Exact synthetic archive only; never upload the workspace.
          retention-days: 7
          if-no-files-found: ignore
      - name: Integration logs on failure
        if: failure()
        run: docker compose -f compose.integration.yaml logs --tail=200
      - name: Remove isolated test environment
        if: always()
        run: docker compose -f compose.integration.yaml down --volumes
