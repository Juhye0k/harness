name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked
      - name: Install media verification tools
        run: |
          # EC2 mirror downloads repeatedly exceeded the job limit. Keep Ubuntu
          # package signatures and suites; use its primary archive in this runner.
          # Ubuntu runners can load their regional mirror through a mirror+file URI.
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source_file" ]; then
              sudo sed -E -i 's#https?://[a-z0-9-]+\.ec2\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source_file"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - run: uv run python scripts/verify.py

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker build --target production -t shortform-harness:ci .
      - run: docker compose -f compose.integration.yaml build runner
      - run: docker compose -f compose.integration.yaml up --no-build -d api worker analysis-worker sns-worker
      - name: Run integration and end-to-end flow
        id: integration-tests
        run: docker compose -f compose.integration.yaml run --rm runner
      - name: Collect synthetic end-to-end evidence
        if: always() && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'failure')
        run: |
          mkdir -p .artifacts/e2e
          if ! docker compose -f compose.integration.yaml run --rm --no-deps -T --entrypoint /bin/tar runner --exclude='*.mp4' -C /data -cf - e2e > .artifacts/e2e/evidence.tar; then
            echo "No complete end-to-end evidence was available; inspect the test failure above."
          fi
      - uses: actions/upload-artifact@v7
        if: always() && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'failure')
        with:
          name: synthetic-e2e-evidence
          path: .artifacts/e2e/evidence.tar
          include-hidden-files: true # Exact synthetic archive only; never upload the workspace.
          retention-days: 7
          if-no-files-found: ignore
      - name: Integration logs on failure
        if: failure()
        run: docker compose -f compose.integration.yaml logs --tail=200
      - name: Remove isolated test environment
        if: always()
        run: docker compose -f compose.integration.yaml down --volumes
