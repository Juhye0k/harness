name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked
      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run python scripts/verify.py

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker build --target production -t shortform-harness:ci .
      - run: docker compose -f compose.integration.yaml build runner
      - run: docker compose -f compose.integration.yaml up --no-build -d api worker analysis-worker sns-worker
      - run: docker compose -f compose.integration.yaml run --rm runner
      - name: Integration logs on failure
        if: failure()
        run: docker compose -f compose.integration.yaml logs --tail=200
      - name: Remove isolated test environment
        if: always()
        run: docker compose -f compose.integration.yaml down --volumes
