name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked
      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run python scripts/verify.py

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shortform
          POSTGRES_USER: shortform
          POSTGRES_PASSWORD: local-dev-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortform -d shortform"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://shortform:local-dev-only@localhost:5432/shortform
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - name: Start diagnostic worker
        run: |
          uv run celery -A app.worker:celery_app --result-backend "$REDIS_URL" worker --loglevel=INFO --concurrency=1 > worker.log 2>&1 &
      - run: uv run pytest -m integration -q
      - name: Worker log on failure
        if: failure()
        run: cat worker.log
      - run: docker compose config --quiet
      - run: docker build -t shortform-harness:ci .
