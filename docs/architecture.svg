<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="990" viewBox="0 0 1040 990" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">숏폼 제작 백엔드</title>
<desc id="desc">FastAPI가 요청을 기록하고 Redis로 식별자를 전달한다. Celery 워커가 분석과 영상 출력을 처리한다. PostgreSQL은 업무 상태를, 공유 볼륨은 파일을 저장한다. YouTube 전송은 별도 승인과 SNS 워커를 거친다.</desc>
<rect width="1040" height="990" fill="#FAFCFD"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, Noto Sans KR, sans-serif">
<text x="32" y="56" font-size="40" font-weight="700" fill="#152E40">숏폼 제작 백엔드</text>
<text x="32" y="93" font-size="21" font-weight="400" fill="#304D5D">브라우저에서 작업을 접수하고, 반환된 ID로 상태와 결과를 조회한다.</text>
<text x="32" y="154" font-size="25" font-weight="700" fill="#195C89">작업 접수와 Celery 비동기 처리</text>
<rect x="32" y="229" width="215" height="148" rx="12" fill="white" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="50" y="264" font-size="23" font-weight="700" fill="#195C89">브라우저</text>
<text x="50" y="296" font-size="19" font-weight="400" fill="#304D5D">영상 링크 또는 파일</text>
<text x="50" y="323" font-size="19" font-weight="400" fill="#304D5D">후보 선택 · 자막 편집</text>
<text x="50" y="350" font-size="19" font-weight="400" fill="#304D5D">원음 확인 후 출력</text>
<path d="M247 303 H271 m-7 -5 7 5 -7 5" fill="none" stroke="#195C89" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="272" y="229" width="200" height="148" rx="12" fill="white" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="290" y="264" font-size="23" font-weight="700" fill="#195C89">FastAPI</text>
<text x="290" y="296" font-size="19" font-weight="400" fill="#304D5D">입력 검증</text>
<text x="290" y="323" font-size="19" font-weight="400" fill="#304D5D">작업을 DB에 기록</text>
<text x="290" y="350" font-size="19" font-weight="400" fill="#304D5D">작업 ID 발행</text>
<path d="M472 303 H496 m-7 -5 7 5 -7 5" fill="none" stroke="#195C89" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="497" y="248" width="152" height="111" rx="12" fill="#EAF4FA" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="515" y="283" font-size="23" font-weight="700" fill="#195C89">Redis</text>
<text x="515" y="315" font-size="19" font-weight="400" fill="#304D5D">작업 ID 전달</text>
<path d="M649 303 H673 M673 235 V373" fill="none" stroke="#195C89" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M673 235 H700 m-7 -5 7 5 -7 5" fill="none" stroke="#195C89" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M673 373 H700 m-7 -5 7 5 -7 5" fill="none" stroke="#195C89" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="701" y="175" width="307" height="125" rx="12" fill="#EAF4FA" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="719" y="210" font-size="23" font-weight="700" fill="#195C89">analysis 큐 → 분석 워커</text>
<text x="719" y="242" font-size="19" font-weight="400" fill="#304D5D">음성 전사</text>
<text x="719" y="269" font-size="19" font-weight="400" fill="#304D5D">추천 모드에서 후보 생성·채점</text>
<rect x="701" y="312" width="307" height="150" rx="12" fill="#EAF4FA" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="719" y="347" font-size="23" font-weight="700" fill="#195C89">video 큐 → 영상 워커</text>
<text x="719" y="379" font-size="19" font-weight="400" fill="#304D5D">업로드 검증 · 10초 추출</text>
<text x="719" y="406" font-size="19" font-weight="400" fill="#304D5D">선택한 후보 구간 추출</text>
<text x="719" y="433" font-size="19" font-weight="400" fill="#304D5D">확정 자막으로 세로 MP4 출력</text>
<text x="32" y="446" font-size="18" font-weight="400" fill="#304D5D">전사·추천은 AI 제공자를 설정하고 활성화한 뒤 실행한다.</text>
<text x="32" y="522" font-size="25" font-weight="700" fill="#116C63">API와 워커가 공유하는 저장소</text>
<rect x="32" y="547" width="474" height="137" rx="12" fill="#EBF6F3" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="50" y="582" font-size="23" font-weight="700" fill="#116C63">PostgreSQL  ·  업무 상태의 기준</text>
<text x="50" y="614" font-size="19" font-weight="400" fill="#304D5D">작업 상태 · 전사 · 추천 후보 · 자막 편집 버전</text>
<text x="50" y="641" font-size="19" font-weight="400" fill="#304D5D">API는 상태를 조회하고 워커는 처리 결과를 기록</text>
<rect x="524" y="547" width="484" height="137" rx="12" fill="#EBF6F3" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="542" y="582" font-size="23" font-weight="700" fill="#116C63">공유 파일 볼륨  ·  영상 데이터</text>
<text x="542" y="614" font-size="19" font-weight="400" fill="#304D5D">/uploads · 업로드한 원본</text>
<text x="542" y="641" font-size="19" font-weight="400" fill="#304D5D">/data · 작업 파일과 다운로드용 MP4</text>
<text x="32" y="752" font-size="25" font-weight="700" fill="#75436A">YouTube 게시 승인</text>
<text x="289" y="751" font-size="18" font-weight="400" fill="#75436A">선택 기능 · 기본 비활성</text>
<rect x="32" y="778" width="351" height="160" rx="12" fill="white" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="50" y="813" font-size="23" font-weight="700" fill="#75436A">사용자 확인 → FastAPI</text>
<text x="50" y="845" font-size="19" font-weight="400" fill="#304D5D">출력 버전 · 채널 · 제목 · 공개 범위</text>
<text x="50" y="872" font-size="19" font-weight="400" fill="#304D5D">아동용 여부를 포함한 초안을 확인</text>
<text x="50" y="899" font-size="19" font-weight="400" fill="#304D5D">서버가 승인 내용의 일치를 검사</text>
<path d="M383 854 H411 m-7 -5 7 5 -7 5" fill="none" stroke="#75436A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="412" y="797" width="172" height="116" rx="12" fill="#F7EEF5" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="430" y="832" font-size="23" font-weight="700" fill="#75436A">Redis</text>
<text x="430" y="864" font-size="19" font-weight="400" fill="#304D5D">sns 큐에 ID 전달</text>
<path d="M584 854 H612 m-7 -5 7 5 -7 5" fill="none" stroke="#75436A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="613" y="778" width="395" height="160" rx="12" fill="#F7EEF5" stroke="#B8CAD3" stroke-width="1.5"/>
<text x="631" y="813" font-size="23" font-weight="700" fill="#75436A">SNS 전용 워커 → YouTube</text>
<text x="631" y="845" font-size="19" font-weight="400" fill="#304D5D">승인한 출력과 파일 해시(SHA-256) 대조</text>
<text x="631" y="872" font-size="19" font-weight="400" fill="#304D5D">일치하는 MP4만 승인한 채널로 전송</text>
<text x="631" y="899" font-size="19" font-weight="400" fill="#304D5D">전송 상태를 PostgreSQL에 기록</text>
</g></svg>
